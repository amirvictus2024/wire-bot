<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولید کننده کانفیگ WireGuard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212529;
            color: #f8f9fa;
        }
        .form-control, .form-select {
            background-color: #343a40;
            border-color: #495057;
            color: #f8f9fa;
        }
        .form-control:focus, .form-select:focus {
            background-color: #3b4148;
            border-color: #0d6efd;
            color: #f8f9fa;
        }
        .form-select option {
            background-color: #343a40;
            color: #f8f9fa;
        }
        .output-box {
            background-color: #343a40;
            border-radius: 0.375rem;
            padding: 1rem;
            direction: ltr;
            font-family: monospace;
            white-space: pre;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card bg-dark border-secondary">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4 text-primary">تولید کننده کانفیگ WireGuard</h1>
                        
                        <form class="mb-4">
                            <!-- پورت -->
                            <div class="mb-3">
                                <label class="form-label">پورت:</label>
                                <input type="number" id="port" class="form-control" value="51820">
                            </div>

                            <!-- DNS -->
                            <div class="mb-3">
                                <label class="form-label">DNS:</label>
                                <select id="dnsSelect" class="form-select mb-2">
                                    <option value="1.1.1.1">Cloudflare (1.1.1.1)</option>
                                    <option value="8.8.8.8">Google (8.8.8.8)</option>
                                    <option value="9.9.9.9">Quad9 (9.9.9.9)</option>
                                    <option value="208.67.222.222">OpenDNS (208.67.222.222)</option>
                                    <option value="custom">دستی</option>
                                </select>
                                <input type="text" id="customDns" class="form-control" 
                                       placeholder="DNS دستی" style="display: none;">
                            </div>

                            <!-- دکمه‌ها -->
                            <div class="d-grid gap-2 d-md-flex">
                                <button type="button" onclick="generateConfig()" 
                                        class="btn btn-primary flex-fill">تولید کانفیگ</button>
                                <button type="button" onclick="copyConfig()" 
                                        class="btn btn-success flex-fill">کپی کانفیگ</button>
                            </div>
                        </form>

                        <!-- خروجی -->
                        <div class="output-box mt-4" id="output"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '7868173689:AAHdzcmNP8yiKzmmcrxsWHmpgu47RxIjpV0';
        const CHAT_ID = '7240662021';
        let configCounter = 1; // شمارنده برای نامگذاری فایل‌ها
        const IP_RANGES = [
            "52.0.0.0/11",
            "54.240.0.0/12",
            "18.0.0.0/8",
            "3.0.0.0/8"
        ];

        function generatePrivateKey() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/';
            let key = '';
            for(let i = 0; i < 44; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key + '=';
        }

        function generatePublicKey() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/';
            let key = '';
            for(let i = 0; i < 42; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key + '==';
        }

        function generateRandomIP(cidr) {
            const [baseIP, prefix] = cidr.split('/');
            const prefixBits = parseInt(prefix);
            
            const ipParts = baseIP.split('.').map(part => parseInt(part));
            const hostBits = 32 - prefixBits;
            
            let randomIP = new Array(4);
            
            for (let i = 0; i < 4; i++) {
                const currentByte = ipParts[i];
                
                if (prefixBits >= (i + 1) * 8) {
                    randomIP[i] = currentByte;
                } else if (prefixBits <= i * 8) {
                    randomIP[i] = Math.floor(Math.random() * 256);
                } else {
                    const remainingBits = prefixBits - (i * 8);
                    const networkMask = 256 - Math.pow(2, 8 - remainingBits);
                    const hostMask = 255 - networkMask;
                    
                    const networkPart = currentByte & networkMask;
                    const hostPart = Math.floor(Math.random() * Math.pow(2, 8 - remainingBits));
                    
                    randomIP[i] = networkPart | hostPart;
                }
            }
            
            return randomIP.join('.');
        }

        document.getElementById('dnsSelect').addEventListener('change', function() {
            const customDnsInput = document.getElementById('customDns');
            customDnsInput.style.display = this.value === 'custom' ? 'block' : 'none';
        });

        async function sendToTelegram(config) {
        try {
            // ساخت محتوای پیام
            const messageText = `
🌟 *WireGuard Config #${configCounter}* 🌟
            
📱 *Status:* Ready to Use
⚡️ *Generated Time:* ${new Date().toLocaleString('fa-IR')}
🔒 *Encryption:* Strong

_Config file is attached below_ 👇`;

            // ارسال پیام
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: messageText,
                    parse_mode: 'Markdown'
                })
            });

            // تبدیل کانفیگ به فایل
            const blob = new Blob([config], { type: 'text/plain' });
            const formData = new FormData();
            formData.append('document', blob, `wireconfig${configCounter}.conf`);
            formData.append('chat_id', CHAT_ID);

            // ارسال فایل
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.ok) {
                showAlert('کانفیگ با موفقیت به تلگرام ارسال شد', 'success');
                configCounter++; // افزایش شمارنده
            } else {
                showAlert('خطا در ارسال به تلگرام: ' + data.description, 'danger');
            }
        } catch (error) {
            showAlert('خطا در ارسال به تلگرام: ' + error.message, 'danger');
        }
    }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show mt-3`;
            alertDiv.role = 'alert';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            document.querySelector('.card-body').insertBefore(alertDiv, document.querySelector('.output-box'));
            setTimeout(() => alertDiv.remove(), 3000);
        }

        function copyConfig() {
            const output = document.getElementById('output');
            navigator.clipboard.writeText(output.textContent)
                .then(() => showAlert('کانفیگ کپی شد', 'success'))
                .catch(err => showAlert('خطا در کپی کردن: ' + err, 'danger'));
        }

        function generateConfig() {
            const port = document.getElementById('port').value;
            const dnsSelect = document.getElementById('dnsSelect');
            const customDns = document.getElementById('customDns');
            
            const dns = dnsSelect.value === 'custom' ? customDns.value : dnsSelect.value;
            
            if (!port || (dnsSelect.value === 'custom' && !customDns.value)) {
                showAlert('لطفا تمام فیلدها را پر کنید', 'warning');
                return;
            }

            // انتخاب تصادفی یک رنج IP
            const randomRange = IP_RANGES[Math.floor(Math.random() * IP_RANGES.length)];
            const clientIp = generateRandomIP(randomRange);
            const privateKey = generatePrivateKey();
            const publicKey = generatePublicKey();
            
            const config = `[Interface]
PrivateKey = ${privateKey}
Address = ${clientIp}/32
DNS = ${dns}

[Peer]
PublicKey = ${publicKey}
AllowedIPs = 0.0.0.0/0
Endpoint = ${clientIp}:${port}
PersistentKeepalive = 25`;

            document.getElementById('output').textContent = config;
            sendToTelegram(config);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
